name: Update

permissions:
  contents: write

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 */2 * * *'

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install Python packages
        run: pip install -r config/requirements.txt

      - name: Execute script
        run: python scripts/main.py "${{ secrets.GEMINI_TOKEN }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Schedule: feed updated" || echo "No changes to commit"
          git push
